name: Build

# Documentation-only pushes do not change what the jar does, and the game tests
# are the expensive half of this workflow. Skipping them costs nothing to catch.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Only the newest push to a branch is worth checking. Without this, a run of
# small commits leaves a queue of jobs each verifying a state nobody will keep,
# and the game tests make every one of them expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash gradlew build

      # Compiling only proves the code is well formed, which the local build
      # already says. This is the step that checks the mod does what it claims:
      # it launches a headless server, runs every registered game test, and
      # exits non-zero if any of them fail.
      - name: Run game tests
        run: bash gradlew runGameTestServer
