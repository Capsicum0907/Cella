name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash gradlew build

      - name: Run game tests
        run: |
          set -o pipefail
          if grep -rq "@GameTestHolder" src/main/java; then
            bash gradlew runGameTestServer | tee gametest.log
            # The server exits 0 even when the mod fails to load; only this line proves tests ran.
            if ! grep -q "GAME TESTS COMPLETE" gametest.log; then
              echo "::error::The game test server exited without reporting a result - the tests never ran."
              exit 1
            fi
          else
            echo "::warning::No @GameTestHolder in src/main/java - nothing was verified beyond compiling."
          fi
