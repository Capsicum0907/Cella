name: Build

# Documentation-only pushes do not change what the jar does, and the game tests
# are the expensive half of this workflow. Skipping them costs nothing to catch.
#
# workflow_dispatch takes no path filter by design: a manual run is asked for by
# a person who already knows what they want checked. It is the way to re-verify
# a branch nothing has been pushed to - the toolchain and the dependencies move
# even when the code does not.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Only the newest push to a branch is worth checking. Without this, a run of
# small commits leaves a queue of jobs each verifying a state nobody will keep,
# and the game tests make every one of them expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash gradlew build

      # Compiling only proves the code is well formed, which the local build
      # already says. This is the step that checks the mod does what it claims:
      # it launches a headless server, runs every registered test, and exits
      # non-zero if any of them fail.
      #
      # Asked rather than assumed, because GameTestServer treats having no tests
      # as a reason to crash, and a mod that is still a scaffold has none. One
      # workflow that adapts beats two that drift: a new mod starts without
      # tests, gains them, and this step starts running on its own. The skip is
      # announced so that "no tests ran" cannot be read as "all tests passed".
      - name: Run game tests
        run: |
          set -o pipefail
          if grep -rq "@GameTestHolder" src/main/java; then
            bash gradlew runGameTestServer | tee gametest.log
            # The server exits zero when the mod fails to construct, so the task
            # goes green having run nothing at all. Only the summary line proves
            # the tests were reached.
            if ! grep -q "GAME TESTS COMPLETE" gametest.log; then
              echo "::error::The game test server exited without reporting a result - the tests never ran."
              exit 1
            fi
          else
            echo "::warning::No @GameTestHolder in src/main/java - nothing was verified beyond compiling."
          fi
