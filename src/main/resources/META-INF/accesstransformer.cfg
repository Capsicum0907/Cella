# A slot's position has to be able to move.
#
# Every page's slots exist in the menu at once - that is what lets a sorting mod see
# the whole chest - and they cannot all sit at the same coordinates. Anything that
# works out which slot the mouse is over from its position finds eight candidates in
# one square and is entitled to pick any of them. Vanilla's own lookup asks isActive
# first and is safe; a mod's need not, and one that hooks the same click is looking
# at the same eight.
#
# So the page not on show is moved out of the way, which is what Expanded Storage
# did. x and y are public final in vanilla and there is no setter in NeoForge, so
# they are unfinalled here rather than shadowed: the screen reads the fields
# directly, and a shadow would be read by nobody.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
